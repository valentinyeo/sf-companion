name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  bug-fix-repro:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
      - name: Bug fixes reproduce first
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          scripts/check_bug_pr.py --title "$PR_TITLE" --labels "$PR_LABELS" --body-file "$RUNNER_TEMP/pr-body.txt" --base "$BASE_SHA" --head "$HEAD_SHA"
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Feed change rebuilds the site
        run: scripts/check-feed-rebuilds.sh
      - name: Rule table, exact pins, and CI scope
        run: scripts/check-rule-table && scripts/check-exact-pins && scripts/check_ci_scope.py
      - name: Feature map matches source
        run: scripts/feature_coverage.py
      - name: Fixture holds production scale
        run: scripts/check_fixture_scale.py
      - name: Test the repo checks and scripts
        run: >-
          python3 -m unittest discover -s tools -p "test_check_*.py" -v && pnpm exec vitest run scripts/rules.test.ts
      - name: Test factory KPI exporter
        run: python3 -m unittest discover -s tools -p "test_factory*.py" -v
      - name: Test verifier scripts
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check and test
        run: pnpm turbo run check test build --concurrency=2
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
