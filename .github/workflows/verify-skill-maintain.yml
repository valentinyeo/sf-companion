name: Verify skill maintenance

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-skill-maintain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pinned pstack source
        uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: e58dd043600587dbaf58ba315e7f2b38373eeb43
          path: pstack-source
          persist-credentials: false
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Compare the recorded pstack version with the pinned source
        id: pstack
        continue-on-error: true
        env:
          RECORDS: ${{ runner.temp }}/records
        run: |
          set -o pipefail
          mkdir -p "$RECORDS"
          scripts/pstack_pin_drift.py \
            --source pstack-source/pstack/.cursor-plugin/plugin.json | tee "$RECORDS/pstack.md"
      - name: Drive every journey
        id: journeys
        continue-on-error: true
        env:
          PROOF_DIR: ${{ runner.temp }}/proof
        run: .claude/skills/verify-sf-companion/run.sh --live
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Review the feature map against source and proof
        id: review
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PSTACK_OUTCOME: ${{ steps.pstack.outcome }}
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          RECORDS: ${{ runner.temp }}/records
          PROMPT: |
            You maintain the verification skill for valentinyeo/sf-companion at ${{ github.sha }} on ${{ github.ref_name }}. Read ${{ github.workspace }}/pstack-source/pstack/skills/maintain-verification-skill/SKILL.md before anything else, then ${{ github.workspace }}/pstack-source/pstack/skills/create-verification-skill/SKILL.md for what a feature map must hold. You did not write this skill and you are not here to author it.

            The skill under review is .claude/skills/verify-sf-companion: SKILL.md, features/*.md, run.sh, and verify.mjs. This workflow already ran .claude/skills/verify-sf-companion/run.sh --live, driving every journey in a real Chromium browser at 1280 and 390 wide, light and dark. That run ended with outcome: ${{ steps.journeys.outcome }}. Its proof is at ${{ runner.temp }}/proof: result.json, one PNG screenshot and one ARIA snapshot per case, per-case JSON action logs, and the install, build, and dev logs.

            Do this:
            1. Read features/README.md and every features/*.md. Read .claude/skills/verify-sf-companion/SKILL.md, run.sh, and verify.mjs.
            2. Run python3 scripts/feature_coverage.py. It derives every user-facing feature from source: the route union in apps/web/src/features/route.ts, the hub sections in apps/web/src/content/item.ts, the factory sections in apps/web/src/features/factory.ts, the share handlers in apps/web/src/content/share.ts, and the deployed Website in apps/web/src/website.ts.
            3. For each feature file, read the source files on its Code paths line and check the user-facing description and every sub-feature journey against that source. Flag a journey the source no longer has, a behaviour the source changed, or a prerequisite the map omits. Cite file:line.
            4. Sweep apps/web/src and apps/web/content for a user-facing feature with no feature file, and a feature file covering nothing. Require a concrete source path before calling one missing.
            5. Read ${{ runner.temp }}/proof/result.json. Treat a failed journey as map drift when the map describes something the app no longer does, and as a product gap when the app itself is broken. Say which, with the journey id and the failing case. A full run that did not finish means coverage was blocked, which is drift to report.

            Rules:
            - Read only. Do not edit, create, or delete a tracked file. Do not commit, push, open a pull request, merge, deploy, or change GitHub settings.
            - If a journey failed and the source makes you suspect the map is wrong, you may re-drive only that journey with .claude/skills/verify-sf-companion/run.sh --journeys=<id> and PROOF_DIR=${{ runner.temp }}/proof-retry. Never re-drive the whole map.
            - Report a product gap, never fix it here.

            Finish with exactly one standalone line: VERDICT: CLEAN when the map matches the app and every journey passed, or VERDICT: DRIFT when anything drifted, failed, or could not be checked. After it, write a ## Findings section with one bullet per finding, each naming a file:line or a journey id in one sentence, or "None." Plain and specific, no praise.
        run: |
          set -o pipefail
          test -n "$OPENCODE_API_KEY"
          mkdir -p "$RECORDS"
          pi --provider opencode-go --model deepseek-v4.1-flash --thinking low \
            --no-extensions --no-mcp --no-skills --no-context-files \
            --no-prompt-templates --no-themes --tools read,bash \
            --no-session --mode json -p "$PROMPT" > "$RECORDS/review.jsonl"
      - name: Keep the checkout clean
        id: clean
        run: git diff --exit-code
      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintain-proof
          path: ${{ runner.temp }}/proof
          if-no-files-found: ignore
      - name: Upload the run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintain-records
          path: ${{ runner.temp }}/records
          if-no-files-found: ignore
      - name: Decide the drift
        id: decide
        if: always()
        env:
          PSTACK_OUTCOME: ${{ steps.pstack.outcome }}
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          RECORDS: ${{ runner.temp }}/records
        run: |
          set -euo pipefail
          mkdir -p "$RECORDS"
          scripts/drift_decision.py > "$RECORDS/decision.json"
      - name: Record the drift
        if: always()
        uses: actions/github-script@v7
        env:
          RECORDS: ${{ runner.temp }}/records
        with:
          script: |
            const fs = require("fs");
            const read = (file) => {
              try {
                return fs.readFileSync(file, "utf8");
              } catch {
                return "";
              }
            };
            const decision = (() => {
              try {
                return JSON.parse(read(`${process.env.RECORDS}/decision.json`));
              } catch {
                return { drift: true, verdict: null, text: "", reasons: ["The drift decision could not be read."] };
              }
            })();
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pstack = read(`${process.env.RECORDS}/pstack.md`).trim() || "The pstack pin check produced no output.";
            const reasons = decision.reasons.length === 0 ? ["Clean."] : decision.reasons;
            const body = [
              "The weekly review of `.claude/skills/verify-sf-companion` against the app source, a full journey run, and the pinned pstack source.",
              "",
              `Run: ${run}`,
              `Commit: ${process.env.HEAD_SHA}`,
              "",
              "## pstack pin",
              pstack,
              "",
              "## Decision",
              ...reasons.map((reason) => `- ${reason}`),
              "",
              "## Feature map",
              decision.text.slice(0, 20000) || "(the review produced no text)",
            ].join("\n");
            const title = "verify map drift";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);
            if (decision.drift) {
              const issue = existing === undefined
                ? (await github.rest.issues.create({ ...context.repo, title, body })).data
                : (await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body })).data;
              core.notice(`verify map drift: ${issue.html_url}`);
              core.setFailed("The verify map drifted; see the verify map drift issue");
            } else if (existing !== undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Clean at ${process.env.HEAD_SHA}. ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
              core.notice(`verify map clean; closed ${existing.html_url}`);
            } else {
              core.notice("verify map clean");
            }
