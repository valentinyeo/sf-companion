name: Nightly journeys

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Drive every journey
        env:
          PROOF_DIR: ${{ runner.temp }}/proof
        run: .claude/skills/verify-sf-companion/run.sh --live
      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-journeys-proof
          path: ${{ runner.temp }}/proof
          if-no-files-found: ignore
